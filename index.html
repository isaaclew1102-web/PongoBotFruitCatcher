<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PongoBot Jungle Fruit Catcher — Mobile Friendly</title>
<style>
:root{--btn:#f08a24;--muted:#999;}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:#558B2F;display:flex;justify-content:center;padding:12px;}
.game-wrap{width:100%;max-width:480px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.12);overflow:hidden;}
header{display:flex;justify-content:space-between;padding:12px;background:#f0f0f0;align-items:center;flex-wrap:wrap;}
.hud{display:flex;gap:8px;align-items:center;font-weight:700;color:#333;flex-wrap:wrap;}
.canvas-wrap{position:relative;background:#000;border-radius:6px;overflow:hidden;}
canvas{display:block;width:100%;height:auto;}
.bottom{display:flex;justify-content:center;gap:8px;padding:12px;flex-wrap:wrap;}
.btn{flex:1 1 45%;padding:12px;border:none;border-radius:10px;font-size:16px;background:var(--btn);color:#fff;cursor:pointer;transition:0.18s;}
.btn.muted{background:var(--muted);}
#endBtn{background:#d32f2f;}
#endBtn:hover{background:#f44336;}
.message{padding:10px 16px;background:#f0f0f0;font-size:15px;color:#333;text-align:center;}
.voice-bubble{position:absolute;pointer-events:none;background:rgba(255,255,255,0.96);border-radius:12px;padding:6px 10px;font-weight:700;color:#222;box-shadow:0 8px 24px rgba(0,0,0,0.18);white-space:nowrap;opacity:0;transition:opacity 180ms ease, transform 180ms ease;z-index:1000;}
.badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#ffd54f,#ff8a65);padding:6px 14px;border-radius:999px;font-weight:800;color:#4a2b00;box-shadow:0 6px 20px rgba(0,0,0,0.12);display:none;z-index:20}
.badge.active{display:block;}
.tint-overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:0.35;z-index:5}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.score-small{font-size:14px;color:#333}
</style>
</head>
<body>
<div class="game-wrap">
  <header>
    <div style="display:flex;gap:12px;align-items:center">
      <div class="hud">
        <div id="lives">❤️❤️❤️</div>
        <div id="score" class="score-small">Score: 0</div>
        <div id="combo" class="score-small">Combo: 0</div>
      </div>
    </div>
    <div class="header-right">
      <button id="startBtn" class="btn">Start</button>
      <button id="muteBtn" class="btn">🔊 Mute</button>
      <button id="endBtn" class="btn">End Game</button>
    </div>
  </header>

  <div class="canvas-wrap" id="canvasWrap">
    <div id="feverBadge" class="badge">FEVER MODE! 🔥</div>
    <canvas id="game" aria-label="PongoBot fruit catcher"></canvas>
    <div id="tint" class="tint-overlay" aria-hidden="true"></div>
  </div>

  <div class="bottom">
    <button id="leftBtn" class="btn">⬅️ Left</button>
    <button id="rightBtn" class="btn">➡️ Right</button>
  </div>

  <div class="message" id="message">Ooo ooo! Press Start to help PongoBot catch fruits in the jungle! 🌿</div>
</div>

<div id="voiceBubble" class="voice-bubble" aria-hidden="true"></div>

<script>
(() => {
  const NUM_PATHS = 6, CANVAS_BASE_HEIGHT = 520;
  const MOVE_SPEED = 0.22, COMBO_THRESHOLD = 5, FEVER_THRESHOLD = 10;
  const COMBO_DURATION = 5000, FEVER_DURATION = 10000, DAYNIGHT_CYCLE_MS = 60000;
  const BASE_WIDTH = 920; // original design

  let PLAYER_SIZE = 264, FRUIT_SIZE = 192;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const muteBtn = document.getElementById('muteBtn');
  const endBtn = document.getElementById('endBtn');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');
  const messageEl = document.getElementById('message');
  const livesEl = document.getElementById('lives');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const voiceBubble = document.getElementById('voiceBubble');
  const feverBadge = document.getElementById('feverBadge');
  const tintOverlay = document.getElementById('tint');

  const images = {};
  ['pongobot','banana','apple','fig','watermelon','durian','jungle_background'].forEach(name=>{
    const img = new Image(); img.src = `assets/${name}.png`; images[name]=img;
  });

  const catchSound = new Audio('assets/sounds/catch.mp3');
  const durianSound = new Audio('assets/sounds/durian.mp3');
  const bgm = new Audio('assets/sounds/bgm.mp3'); bgm.loop=true; bgm.volume=0.45;
  catchSound.volume=0.85; durianSound.volume=0.9;
  let muted=false;
  muteBtn.addEventListener('click', ()=>{
    muted=!muted;
    bgm.muted = muted; catchSound.muted = muted; durianSound.muted = muted;
    muteBtn.textContent = muted?'🔇 Muted':'🔊 Mute';
    muteBtn.classList.toggle('muted',muted);
  });
  function safePlay(audio){ if(muted) return; audio.currentTime=0; audio.play().catch(()=>{}); }

  let DPR = window.devicePixelRatio || 1;
  let pathX=[], W=0, H=0;
  function computePaths(){ W=canvas.width; H=canvas.height; pathX=[]; for(let i=0;i<NUM_PATHS;i++){ pathX.push(Math.round(W*(i+0.5)/NUM_PATHS)); } }

  function resizeCanvas(){
    DPR = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth*DPR;
    canvas.height = canvas.width*(CANVAS_BASE_HEIGHT/BASE_WIDTH)*DPR;

    const scale = canvas.width / BASE_WIDTH;
    PLAYER_SIZE = 264 * scale;
    FRUIT_SIZE = 192 * scale;

    computePaths();
    player.y = canvas.height - Math.round(PLAYER_SIZE/2) - Math.round(12*DPR);
    player.x = pathX[player.path]; player.displayX = player.x;
    draw();
  }
  window.addEventListener('resize', ()=>{ resizeCanvas(); });

  let player={path: Math.floor(NUM_PATHS/2)-1, x:0, y:0, displayX:0};
  let fruits=[], score=0, lives=3, combo=0;
  let lastCatchTime=0, comboActiveUntil=0, feverActiveUntil=0;
  let playing=false, frames=0, spawnInterval=60;
  let animationId;

  const FRUITS_DEF=[
    {image:'banana',pts:3,weight:35},
    {image:'watermelon',pts:5,weight:18},
    {image:'fig',pts:4,weight:15},
    {image:'apple',pts:2,weight:20},
    {image:'durian',pts:0,weight:12,isDurian:true}
  ];

  const voiceLines={
    catch:["Ooo! Sweet snack! 🍌","Yum! That hit my belly!","More fruit! Pongo happy!"],
    miss:["Aiyo… it slipped away!","Noooo! My snack! 😭","Almost… next time!"],
    durian:["OUCH!! Why the durian?! 🌰","Oof! That thing stings!","Who dropped a weapon??"],
    fever:["Fever mode! Go go GO! 🔥","We’re unstoppable now!","Catch spree! Double points!"],
    highScore:["Legendary team! 💪🦧","We crushed the jungle!","Champion catcher!"]
  };

  function showVoice(text,duration=1600){
    const rect=canvas.getBoundingClientRect();
    voiceBubble.style.left = rect.left + (player.displayX/DPR) + 'px';
    voiceBubble.style.top = rect.top + (player.y/DPR) - (PLAYER_SIZE/DPR)*0.6 + 'px';
    voiceBubble.textContent=text;
    voiceBubble.style.opacity=1;
    voiceBubble.style.transform='translate(-50%,-120%) scale(1)';
    voiceBubble.setAttribute('aria-hidden','false');
    setTimeout(()=>{voiceBubble.style.opacity=0; voiceBubble.setAttribute('aria-hidden','true');}, duration);
  }

  function moveLeft(){ player.path = Math.max(0, player.path-1); }
  function moveRight(){ player.path = Math.min(NUM_PATHS-1, player.path+1); }
  window.addEventListener('keydown',(e)=>{ if(e.key==='ArrowLeft') moveLeft(); if(e.key==='ArrowRight') moveRight(); });
  leftBtn.addEventListener('click', moveLeft); rightBtn.addEventListener('click', moveRight);

  function drawBackground(){
    if(images['jungle_background'] && images['jungle_background'].complete) ctx.drawImage(images['jungle_background'],0,0,W,H);
    else { const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#8BC34A'); g.addColorStop(1,'#558B2F'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);}
  }
  function drawPlayer(){ ctx.drawImage(images['pongobot'],player.displayX-PLAYER_SIZE/2,player.y-PLAYER_SIZE/2,PLAYER_SIZE,PLAYER_SIZE); }
  function drawFruits(){ for(const f of fruits) ctx.drawImage(images[f.image],f.x-FRUIT_SIZE/2,f.y-FRUIT_SIZE/2,FRUIT_SIZE,FRUIT_SIZE); }
  function draw(){ ctx.clearRect(0,0,W,H); drawBackground(); drawFruits(); drawPlayer(); }

  function pickRandomFruit(){ let total = FRUITS_DEF.reduce((s,f)=>s+f.weight,0); let r=Math.random()*total; let s=0; for(let f of FRUITS_DEF){s+=f.weight; if(r<=s) return {...f};} return {...FRUITS_DEF[0]}; }
  function spawnFruit(){ const f=pickRandomFruit(); const path=Math.floor(Math.random()*NUM_PATHS); fruits.push({...f,x:pathX[path],y:-FRUIT_SIZE-10,path,speed:2+Math.random()*1.8}); }

  function gainPoints(pts){ const now=performance.now(); if(feverActiveUntil>now) pts*=2; else if(comboActiveUntil>now) pts=Math.round(pts*1.5); score+=pts; }

  function handleCatch(f){
    const now=performance.now();
    if(f.isDurian){ lives=Math.max(0,lives-1); safePlay(durianSound); combo=0; showVoice(voiceLines.durian[Math.floor(Math.random()*3)]); }
    else { gainPoints(f.pts); safePlay(catchSound); if(now-lastCatchTime<3500) combo++; else combo=1; lastCatchTime=now;
      if(combo>=COMBO_THRESHOLD){ comboActiveUntil=now+COMBO_DURATION; showVoice("COMBO! x1.5 🔥",1200); }
      if(combo>=FEVER_THRESHOLD){ feverActiveUntil=now+FEVER_DURATION; feverBadge.classList.add('active'); showVoice(voiceLines.fever[Math.floor(Math.random()*3)],1600);
        setTimeout(()=>{feverBadge.classList.remove('active');},FEVER_DURATION);}
      else if(Math.random()<0.5) showVoice(voiceLines.catch[Math.floor(Math.random()*3)]); }
    livesEl.textContent='❤️'.repeat(lives);
    scoreEl.textContent='Score: '+score;
    comboEl.textContent='Combo: '+combo;
  }

  function update(){
    if(!playing) return;
    frames++;
    if(frames % spawnInterval === 0) spawnFruit();

    for(let i=fruits.length-1;i>=0;i--){
      const f=fruits[i];
      f.y += f.speed*(1 + Math.min(frames/200,0.9));
      if(f.y >= player.y-FRUIT_SIZE/2){
        if(f.path===player.path) handleCatch(f);
        else if(!f.isDurian){ showVoice(voiceLines.miss[Math.floor(Math.random()*3)]); combo=Math.max(0,combo-1); comboEl.textContent='Combo: '+combo;}
        fruits.splice(i,1);
      } else if(f.y>H+FRUIT_SIZE) fruits.splice(i,1);
    }

    player.displayX += (pathX[player.path]-player.displayX)*MOVE_SPEED;

    updateTint();
    draw();

    if(lives<=0){ playing=false; bgm.pause(); feverBadge.classList.remove('active'); messageEl.textContent=`Game Over! Score: ${score} 🍌`; startBtn.textContent='Restart'; return; }

    animationId=requestAnimationFrame(update);
  }

  startBtn.addEventListener('click',()=>{
    if(playing) return;
    playing=true; fruits=[]; frames=0; score=0; lives=3; combo=0;
    comboActiveUntil=0; feverActiveUntil=0; spawnInterval=60;
    player.path=Math.floor(NUM_PATHS/2)-1;
    if(!pathX[player.path]) computePaths();
    player.x=pathX[player.path]; player.displayX=player.x;
    player.y=canvas.height-Math.round(PLAYER_SIZE/2)-Math.round(12*DPR);
    startBtn.textContent='Playing...'; messageEl.textContent='Go! Help PongoBot catch fruits! 🍌';
    bgm.currentTime=0; bgm.play().catch(()=>{}); catchSound.play().catch(()=>{}); catchSound.pause(); durianSound.play().catch(()=>{}); durianSound.pause();
    showVoice("Ooo ooo! Let's go! 🍌",1200);
    update();
  });

  endBtn.addEventListener('click', ()=>{
    if(!playing) return;
    playing=false; bgm.pause(); feverBadge.classList.remove('active');
    fruits=[];
    score=0; combo=0; lives=0;
    scoreEl.textContent='Score: 0'; comboEl.textContent='Combo: 0'; livesEl.textContent='';
    messageEl.textContent='Game Ended. Press Start to play again! 🌿';
    showVoice("Game ended! 🍌",1200);
    startBtn.textContent='Restart';
  });

  function updateTint(){
    const now=performance.now(); const t=((now%DAYNIGHT_CYCLE_MS)/DAYNIGHT_CYCLE_MS);
    const val=Math.sin(t*Math.PI*2); const nightStrength=Math.max(0,(1-val)/2);
    tintOverlay.style.background=`rgba(20,40,80,${0.18+0.22*nightStrength})`;
  }

  function init(){ resizeCanvas(); draw(); }
  init();
})();
</script>
</body>
</html>
